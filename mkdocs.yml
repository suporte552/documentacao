site_name: Gomark.core

theme:
  name: material
  palette:
    primary: deep purple
    accent: deep purple
  features:
    - navigation.sections
    - navigation.expand

# Esta extensão ajuda o MkDocs a entender links e imagens do Obsidian
markdown_extensions:
  - attr_list
  - md_in_html
  - admition
  - pymdownx.superfences
  - pymdownx.tilde
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Campanhas: Campanhas.md
  - FAQ: FAQ.md
  - Fornecedores: Fornecedores.md

# Importante: O MkDocs só lê o que está dentro da pasta 'docs'
docs_dir: docs
