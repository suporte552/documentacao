site_name: Gomark.core

theme:
  name: material
  palette:
    primary: deep purple
    accent: deep purple
  features:
    - navigation.sections
    - navigation.expand

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition  # <-- Corrigido aqui (antes estava admition)
  - pymdownx.superfences
  - pymdownx.tilde
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Campanhas:
      - Gestão de campanhas: Campanhas/Gestão de campanhas.md
  - Campanhas: Campanhas.md
  - FAQ: FAQ.md
  - Fornecedores: Fornecedores.md

docs_dir: docs
