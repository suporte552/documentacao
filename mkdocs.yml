site_name: Gomark.core

theme:
  name: material
  palette:
    primary: deep purple
    accent: deep purple
  features:
    - navigation.sections
    - navigation.expand
    - hide.footer

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.tilde
  - toc:
      permalink: true
  - pymdownx.superfences # <-- Agora sem o código extra que deu erro

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js

nav:
  - Início: index.md
  - Campanhas:
      - Calendários: Campanhas/Calendários.md
      - Gestão de campanhas: Campanhas/Gestão de campanhas.md
  - FAQ: FAQ.md
  - Fornecedores: Fornecedores.md

docs_dir: docs
