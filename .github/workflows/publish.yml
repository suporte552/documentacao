name: ci 
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      # Adicionamos a biblioteca de extensões aqui embaixo:
      - run: pip install mkdocs-material pymdown-extensions mkdocs-mermaid2
      - run: mkdocs gh-deploy --force
